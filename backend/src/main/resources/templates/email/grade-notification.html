<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценка за задание</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .content {
            padding: 30px 20px;
        }
        .grade-box {
            background: #d4edda;
            border-left: 4px solid #28a745;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
            text-align: center;
        }
        .grade {
            font-size: 48px;
            font-weight: bold;
            color: #28a745;
            margin: 0;
        }
        .feedback {
            background: #f8f9fa;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .button {
            display: inline-block;
            padding: 14px 30px;
            margin: 20px 0;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⭐ Работа проверена!</h1>
        </div>

        <div class="content">
            <p>Здравствуйте, <strong th:text="${studentName}">Студент</strong>!</p>

            <p>Ваше домашнее задание <strong th:text="${homeworkTitle}">Название</strong> проверено.</p>

            <div class="grade-box">
                <p style="margin: 0; font-size: 14px; color: #6c757d;">Ваша оценка:</p>
                <p class="grade" th:text="${grade}">95</p>
                <p style="margin: 0; font-size: 14px; color: #6c757d;">из 100 баллов</p>
            </div>

            <div class="feedback">
                <p style="margin: 0 0 10px 0; font-weight: bold; color: #667eea;">Комментарий преподавателя:</p>
                <p style="margin: 0;" th:text="${feedback}">Отличная работа!</p>
            </div>

            <div style="text-align: center;">
                <a th:href="${frontendUrl} + '/student/grades'" class="button">Посмотреть все оценки</a>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2025 CRM LMS. Все права защищены.</p>
        </div>
    </div>
</body>
</html>
