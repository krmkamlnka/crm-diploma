spring:
  application:
    name: crm-lms-backend

  # Конфигурация БД
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_lms
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate  # ВАЖНО: validate, НЕ create/update!
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
    show-sql: false
    open-in-view: false

  # Flyway конфигурация
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  # Email / SMTP конфигурация
  mail:
    host: ${SMTP_HOST:smtp.mail.ru}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:crm.noreply.team@mail.ru}  # Ваш email @mail.ru
    password: ${SMTP_PASSWORD:xwDEp3CgNJZFscj4fie3}  # Пароль от почты или app password
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.mail.ru
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        debug: true
    default-encoding: UTF-8
  web:
    error:
      include-message: always
      include-binding-errors: always
  # Конфигурация загрузки файлов
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

# JWT конфигурация
jwt:
  secret:
    access: ${JWT_ACCESS_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    refresh: ${JWT_REFRESH_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration:
    access: 900000        # 15 минут в миллисекундах
    refresh: 604800000    # 7 дней в миллисекундах

# Конфигурация приложения
app:
  name: "CRM LMS"
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  email:
    from: ${SMTP_USERNAME:crm.noreply.team@mail.ru}
    from-name: "CRM LMS System"

# MinIO конфигурация
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:crm-lms-files}
  profile-photos-folder: "profile-photos"
  max-file-size: 5242880  # 5MB в байтах

# Логирование
logging:
  level:
    kz.attractorschool.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.mail: DEBUG
    org.springframework.mail.javamail: DEBUG
    com.sun.mail: DEBUG

# Server
server:
  port: 8080
